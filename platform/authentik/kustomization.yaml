apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: authentik

resources:
  - ingress.yaml
  - oidc-egress.yaml

generators:
  - ksops-config.yaml

helmCharts:
  - name: authentik
    releaseName: authentik
    version: "2026.8.3"
    repo: https://charts.goauthentik.io
    valuesFile: values.yaml
