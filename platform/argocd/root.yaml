apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab
  namespace: argocd
spec:
  project: default

  source:
    repoURL: git@github.com:nick-ccc/Black-Pearl.git
    targetRevision: HEAD
    path: platform/argocd/cluster-apps

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
