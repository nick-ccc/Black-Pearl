apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: git@github.com:nick-ccc/Black-Pearl.git
      targetRevision: HEAD
      path: platform/
    - repoURL: git@github.com:nick-ccc/Black-Pearl.git
      targetRevision: main
      path: applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
