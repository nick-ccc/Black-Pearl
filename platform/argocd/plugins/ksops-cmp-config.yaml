apiVersion: v1
kind: ConfigMap
metadata:
  name: ksops-cmp
  namespace: argocd
data:
  plugin.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: ksops
    spec:
      generate:
        command:
          - ksops
          - /usr/local/bin/kustomize
          - --enable-alpha-plugins
          - .
