apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  template:
    spec:
      initContainers:
        - name: install-ksops
          image: viaductoss/ksops:v4.3.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Installing KSOPS...";
              cp ksops /custom-tools/;
              cp kustomize /custom-tools/;
              chmod +x /custom-tools/ksops;
              chmod +x /custom-tools/kustomize;
              echo "Done.";
          volumeMounts:
            - mountPath: /custom-tools
              name: custom-tools

      containers:
        - name: argocd-repo-server
          env:
            - name: XDG_CONFIG_HOME
              value: /.config
            - name: SOPS_AGE_KEY_FILE
              value: /sops-age/key.txt

          volumeMounts:
            - mountPath: /usr/local/bin/kustomize
              name: custom-tools
              subPath: kustomize

            - mountPath: /usr/local/bin/ksops
              name: custom-tools
              subPath: ksops

            - mountPath: /sops-age
              name: sops-age
              readOnly: true

      volumes:
        - name: custom-tools
          emptyDir: {}

        - name: sops-age
          secret:
            secretName: sops-age
