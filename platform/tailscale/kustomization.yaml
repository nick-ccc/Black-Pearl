apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tailscale

generators:
  - ksops-config.yaml

resources:
  - dnsconfig.yaml
  - coredns-custom.yaml

helmCharts:
  - name: tailscale-operator
    releaseName: tailscale-operator
    version: "1.102.3"
    repo: https://pkgs.tailscale.com/helmcharts
    valuesFile: values.yaml
