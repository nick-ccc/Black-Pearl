apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  template:
    spec:
      initContainers:
        - name: install-ksops
          image: viaductoss/ksops:v4.5.1
          command:
            - /usr/local/bin/ksops
          args:
            - install
            - /custom-tools
          volumeMounts:
            - mountPath: /custom-tools
              name: custom-tools

        - name: install-kustomize
          image: registry.k8s.io/kustomize/kustomize:v5.8.1
          command:
            - /bin/sh
            - -c
          args:
            - |
              cp /app/kustomize /custom-tools/kustomize
              chmod +x /custom-tools/kustomize
          volumeMounts:
            - name: custom-tools
              mountPath: /custom-tools

      containers:
        - name: argocd-repo-server
          env:
            - name: SOPS_AGE_KEY_FILE
              value: /sops-age/key.txt

          volumeMounts:
            - mountPath: /usr/local/bin/ksops
              name: custom-tools
              subPath: ksops

            - name: custom-tools
              mountPath: /usr/local/bin/kustomize
              subPath: kustomize

            - mountPath: /sops-age
              name: sops-age
              readOnly: true

      volumes:
        - name: custom-tools
          emptyDir: {}

        - name: sops-age
          secret:
            secretName: sops-age
