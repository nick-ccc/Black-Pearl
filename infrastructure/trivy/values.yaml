
# Scan all namespaces
targetNamespaces: ""

# Optional: exclude namespaces
excludeNamespaces: ""

# Scan common Kubernetes workload types
targetWorkloads: "pod,replicaset,replicationcontroller,statefulset,daemonset,cronjob,job"

operator:
  replicas: 1

  # Enable vulnerability scanning
  vulnerabilityScannerEnabled: true

  # Scan only current workload revisions
  vulnerabilityScannerScanOnlyCurrentRevisions: true

  # Enable SBOM generation
  sbomGenerationEnabled: true

  # Enable configuration security scanning
  configAuditScannerEnabled: true

  # Enable RBAC assessment
  rbacAssessmentScannerEnabled: true

  # Enable infrastructure assessment
  infraAssessmentScannerEnabled: true

  # Retain reports for 24 hours
  scannerReportTTL: "24h"

trivy:
  createConfig: true

  # Scan container images
  command: image

  # Include all vulnerability severities
  severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"

  # Include vulnerabilities without available fixes
  ignoreUnfixed: false

  # Scan both OS and application packages
  vulnType: "os,library"

  # Scanner timeout
  timeout: "10m0s"

  # Reduce CPU usage
  slow: true

  # Allow database updates
  offlineScan: false

  image:
    pullPolicy: IfNotPresent

serviceMonitor:
  enabled: true

# Node collector
nodeCollector:
  useNodeSelector: true
  imagePullPolicy: IfNotPresent

