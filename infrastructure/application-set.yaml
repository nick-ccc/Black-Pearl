apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  namespace: argocd
  name: infrastructure
  labels:
    app.kubernetes.io/part-of: platfrom
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  goTemplate: True
  generators:
    - git:
        repoURL: https://github.com/nick-ccc/Black-Pearl.git
        revision: main
        directories:
          - path: infrastructure/*
          # Exclude bootstrap configuration
          - path: infrastructure/argocod
            exclude: true
  template:
    metadata:
      name: 'infrastructure-{{ .path.basename }}'
      namespace: argocd
      labels:
        app.kubernetes.io/component: 'infrastructure'
        app.kubernetes.io/part-of: infrastructure
    spec:
      project: infrastructure
      source:
        repoURL: https://github.com/nick-ccc/Black-Pearl.git
        targetRevision: main
        path: '{{ .path.path }}'
        kustomize: {}
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .path.basename }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
          - PruneLast=true
          - RespectIgnoreDifferences=true
