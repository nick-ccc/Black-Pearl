replicas: 1

service:
  type: ClusterIP
  port: 80

persistence:
  enabled: true
  type: pvc
  size: 5Gi
  storageClassName: local-path

ingress:
  enabled: false

sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: false