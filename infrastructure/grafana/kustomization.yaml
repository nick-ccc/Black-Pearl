apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: grafana

resources:
  - ingress.yaml

helmCharts:
  - name: grafana
    repo: https://grafana-community.github.io/helm-charts
    version: 12.10.0
    releaseName: grafana
    namespace: grafana
    valuesFile: values.yaml

configMapGenerator:
  - name: kubernetes-overview-dashboard
    files:
      - dashboards/kubernetes-overview.json
    options:
      labels:
        grafana_dashboard: "1"

generators:
  - ksops-config.yaml

generatorOptions:
  disableNameSuffixHash: true