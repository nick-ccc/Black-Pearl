apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hermes

resources:
  - ingress.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: hermes-agent
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: hermes-agent
      spec:
        template:
          spec:
            initContainers:
              - name: seed-config
                securityContext:
                  capabilities:
                    add:
                      - CHOWN

helmCharts:
  - name: hermes-agent
    releaseName: hermes-agent
    version: "1.22.0"
    repo: https://jyje.github.io/hermes-agent-helm
    valuesFile: values.yaml
