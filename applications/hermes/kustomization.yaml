apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hermes

resources:
  - ingress.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: hermes-agent
    patch: |-
      - op: replace
        path: /spec/template/spec/initContainers/0/securityContext/capabilities
        value:
          add:
            - CHOWN
          drop:
            - ALL

helmCharts:
  - name: hermes-agent
    releaseName: hermes-agent
    version: "1.22.0"
    repo: https://jyje.github.io/hermes-agent-helm
    valuesFile: values.yaml
