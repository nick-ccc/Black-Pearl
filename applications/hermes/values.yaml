config:
  providers:
    local:
      base_url: http://192.168.0.28:62353/v1
      discover_models: true
  model:
    provider: local
    # Must exactly match the model ID returned by GET /v1/models.
    default: mlx-community/Llama-3.2-3B-Instruct-4bit
  terminal:
    backend: local

  dashboard:
    oauth:
      self_hosted:
        # Authentik OIDC issuer URL
        issuer: https://authentik.komodo-salak.ts.net/application/o/hermes-agent/
        client_id: hermes-agent
        scopes: "openid profile email"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10000
  runAsGroup: 10000
  fsGroup: 10000
  seccompProfile:
    type: RuntimeDefault

dashboard:
  enabled: true
  publicUrl: https://hermes-agent.komodo-salak.ts.net
  auth:
    provider: oidc

service:
  enabled: true
  type: ClusterIP
  port: 9119

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# The rootfs itself is read-only; s6-overlay needs /run writable+executable
# to boot, and the agent's own tooling needs a writable /tmp. HERMES_HOME
# (persistence.mountPath) is already a separate PVC, not rootfs, so it
# doesn't need to be listed here.
# sizeLimit bounds these - a medium:Memory emptyDir is RAM-backed and
# uncapped by default, which would otherwise leave a hardening profile with
# an unbounded memory-exhaustion vector.
extraVolumes:
  - name: run-tmpfs
    emptyDir:
      medium: Memory
      sizeLimit: 16Mi
  - name: tmp-tmpfs
    emptyDir:
      medium: Memory
      sizeLimit: 64Mi

extraVolumeMounts:
  - name: run-tmpfs
    mountPath: /run
  - name: tmp-tmpfs
    mountPath: /tmp

team:
  sharedVolume:
    permissions:
      # The ownership-preparation init container needs root (chown across
      # arbitrary storage backends) - incompatible with `restricted`. Leave
      # disabled and rely on `podSecurityContext.fsGroup` above instead, when
      # the storage backend honours fsGroup.
      enabled: false
